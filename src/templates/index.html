<!DOCTYPE html>
<html>
<head>
    <title>Physics Tutor</title>
</head>
<body>

    <h1>Physics Tutor</h1>

    <form method="POST">
        <input type="text"
               name="question"
               placeholder="Ask a physics question..."
               size="60">

        <button type="submit">Ask</button>
    </form>

    {% if error %}
        <p>{{ error }}</p>
    {% endif %}

    <hr>

    {% for message in chat_history %}
        <p><strong>You:</strong> {{ message.question }}</p>
        <p><strong>Tutor:</strong> {{ message.answer }}</p>
        <hr>
    {% endfor %}

</body>
</html>
